workflow:
  target: 1d
  ansatz: constant
  phase: train
  train: true
  simulate: false
  mpl_backend: Agg
  overwrite_results: true
  wandb:
    enabled: false
    project: NN_FPN
    mode: disabled
    group: null
    tags: [paper, constant_baseline, N3]
    log_interval: 10
    name_template: "1d-paper-constant-N{N}-run{replicate}"

1d:
  enabled: true
  filter_types:
    nn: 1
    constant: 3
  train:
    Ns: [3]
    num_replicates: 10
    hidden_width: 50
    nn_weight_decay: 0.00001
    constant_weight_decay: 0.000001
    params:
      num_IC: 4
      batch_size: 64
      num_epochs: 200
      learning_rate: 0.1
      lr_scheduler: cosine
      lr_warmup_fraction: 0.05
      lr_min_factor: 0.0
      momentum_factor: 0.9
      sigs_max: 1
      GD_optimizer: Adam
      tt_flag: 0
      IC_idx: 0
      device: auto
      ablation_idx: 0
      feature_variant: baseline_norm
      feature_normalization: sample
      material_feature_normalization: none
      feature_log_scale: 1.0
      feature_log_clip: [0.0, 20.0]
      feature_eps: 0.00000001
      include_material_scale_features: false
      include_material_ratios: false
      obj_idx: 0
      training_data: paper
      model_tag: paper_constant_baseline
      training_time_horizons: [0.25, 0.5, 1.0]
      aux_moment_loss_weight: 0.0
      relative_loss_eps: 0.000000000001
  simulate:
    scripts:
      - scripts/test_iters.py
      - scripts/test_iters_reeds.py
      - scripts/test_all.py
    result_dir_template: results_{label}_paper_constant_baseline_N3
    params:
      batch_size: 1
      tt_flag: 1
      device: auto
      ablation_idx: 0
      feature_variant: baseline_norm
      feature_normalization: sample
      material_feature_normalization: none
      feature_log_scale: 1.0
      feature_log_clip: [0.0, 20.0]
      feature_eps: 0.00000001
      include_material_scale_features: false
      include_material_ratios: false
      model_tag: paper_constant_baseline
      Ns: [3]
      num_tests: 10
      reeds_num_x: 512
